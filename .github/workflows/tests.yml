name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Filter ffmpeg.exe -File -Recurse |
            Where-Object { Test-Path (Join-Path $_.DirectoryName 'ffprobe.exe') } | Select-Object -First 1
          if (-not $bin) { throw 'Could not find the FFmpeg binaries' }
          "LOCKFRAME_FFMPEG_DIR=$($bin.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run tests
        env:
          LOCKFRAME_CACHE_DIR: ${{ runner.temp }}/tomato-cache
          LOCKFRAME_LOG_DIR: ${{ runner.temp }}/tomato-logs
          LOCKFRAME_DATA_DIR: ${{ runner.temp }}/tomato-data
        run: python -m pytest -q
