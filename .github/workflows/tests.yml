name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      LOCKFRAME_CACHE_DIR: ${{ runner.temp }}/tomato-cache
      LOCKFRAME_LOG_DIR: ${{ runner.temp }}/tomato-logs
      LOCKFRAME_DATA_DIR: ${{ runner.temp }}/tomato-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Run tests
        run: python -m pytest -q
